name: Docker and browser verification

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ci/docker-browser-check]

permissions:
  contents: read

concurrency:
  group: docker-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TEST_ALLOW_WRITES: '1'
      TEST_DOCKER_RESTART: '1'
      TEST_WEB_URL: http://127.0.0.1:5180
      APP_PORT: '5180'
      COMPOSE_PROJECT_NAME: pathyatra-verification
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build and start the actual containers
        run: |
          docker compose config --quiet
          docker compose up --build --detach --wait --wait-timeout 180
          curl --fail --retry 10 --retry-connrefused http://127.0.0.1:5180/api/health.php
      - name: Run scheduler and HTTP/database tests inside Docker
        run: docker compose --profile test run --rm test
      - name: Test desktop, mobile, map tiles, PDF and database persistence
        run: npm run test:browser --prefix frontend
      - name: Verify a different published port
        run: |
          APP_PORT=5181 docker compose up --detach --no-deps --force-recreate --wait web
          curl --fail --retry 10 --retry-connrefused http://127.0.0.1:5181/api/health.php
          curl --fail http://127.0.0.1:5181/generator | grep -q '<div id="root"'
      - name: Collect container diagnostics
        if: always()
        run: |
          mkdir -p verification-artifacts
          docker compose ps --all > verification-artifacts/containers.txt
          docker compose logs --no-color > verification-artifacts/containers.log 2>&1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: docker-browser-verification
          retention-days: 14
          path: |
            verification-artifacts/
            frontend/playwright-report/
            frontend/test-results/
      - name: Stop the disposable test stack
        if: always()
        run: docker compose down --volumes --remove-orphans
